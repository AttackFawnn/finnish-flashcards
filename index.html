<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnish Flashcards</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100dvh;
            padding: 10px;
        }

        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .container {
            width: 100%;
            max-width: 600px;
            max-height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .screen {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Setup Screen */
        .setup-section {
            margin-bottom: 25px;
        }

        .setup-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .category-btn-name {
            font-size: 13px;
            font-weight: 700;
        }

        .category-btn-count {
            font-size: 11px;
            color: #666;
            font-weight: 400;
        }

        .category-btn:hover {
            border-color: #667eea;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .category-btn.active .category-btn-count {
            color: rgba(255,255,255,0.8);
        }

        .reset-progress-link {
            display: block;
            margin: 15px auto 0;
            background: none;
            border: none;
            color: #999;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            padding: 4px;
        }

        .reset-progress-link:hover {
            color: #e74c3c;
        }

        .option-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            min-width: 100px;
        }

        .option-btn:hover {
            border-color: #667eea;
        }

        .option-btn-icon {
            font-size: 20px;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .option-btn-desc {
            font-size: 9px;
            font-weight: 400;
            line-height: 1.2;
            margin-top: 3px;
            opacity: 0.75;
        }

        .option-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .option-btn.challenge {
            color: #e67e22;
            border-color: #e67e22;
        }

        .option-btn.challenge.active {
            background: linear-gradient(135deg, #f7971e 0%, #e67e22 100%);
            color: white;
            border-color: #e67e22;
        }

        .setup-divider {
            border-top: 1px solid #e5e5e5;
            margin-top: 20px;
        }

        .setup-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .start-btn {
            flex: 3;
            padding: 15px 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .wordbank-btn {
            flex: 2;
            padding: 15px 6px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
            transition: all 0.2s;
        }

        .wordbank-btn:hover {
            border-color: #667eea;
        }

        /* Word Bank Screen */
        .wordbank-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .wordbank-title {
            font-size: 20px;
            color: #333;
            margin: 0;
        }

        .wordbank-category {
            border: 2px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .wordbank-category-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            text-align: left;
            transition: background 0.2s;
        }

        .wordbank-category-header:hover {
            background: #f8f9fa;
        }

        .wordbank-chevron {
            color: #667eea;
            font-size: 12px;
        }

        .wordbank-words {
            padding: 6px 15px 12px;
            background: #f8f9fa;
        }

        .wordbank-word-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #e8e8e8;
            font-size: 14px;
        }

        .wordbank-word-row:last-child {
            border-bottom: none;
        }

        .wordbank-fi {
            font-weight: 600;
            color: #333;
        }

        .wordbank-sep {
            color: #bbb;
        }

        .wordbank-en {
            color: #666;
        }

        /* Letter Sounds Screen */
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .letter-card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 12px 6px;
            text-align: center;
            background: #f8f9fa;
        }

        .letter-char {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .letter-sound {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-top: 4px;
        }

        .letter-example {
            font-size: 10px;
            font-style: italic;
            color: #999;
            margin-top: 2px;
        }

        /* Card Screen */
        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            position: relative;
        }

        .progress-info {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-buttons {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            pointer-events: auto;
            padding: 5px 10px;
        }

        .nav-btn:hover {
            color: #667eea;
        }

        .card-stack {
            position: relative;
            margin: 30px 0;
            min-height: 250px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 40px 20px;
            display: flex;
            cursor: pointer;
            user-select: none;
            z-index: 2;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .card.english {
            background: linear-gradient(135deg, #4a5aa8 0%, #523370 100%);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.slide-left {
            transform: translateX(-130%) rotate(-8deg);
            opacity: 0;
        }

        .card.sink-back {
            transform: scale(0.85) translateY(35px);
            opacity: 0;
        }

        .card-ghost {
            cursor: default;
            pointer-events: none;
        }

        .card-ghost-1 {
            z-index: 1;
            transform: scale(0.96) translateY(10px);
            opacity: 0.6;
        }

        .card-ghost-2 {
            z-index: 0;
            transform: scale(0.92) translateY(20px);
            opacity: 0.35;
        }

        .card-leaving {
            z-index: 3;
            pointer-events: none;
        }

        .card-label {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
        }

        .card-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            word-wrap: break-word;
        }

        @media (max-width: 480px) {
            .card-content {
                font-size: 24px;
            }
            .card-stack {
                min-height: 200px;
            }
            .card {
                padding: 30px 15px;
            }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .challenge-link {
            display: block;
            margin: 15px auto 0;
            background: none;
            border: none;
            color: #e67e22;
            font-size: 13px;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
            padding: 4px;
        }

        .challenge-link:hover {
            color: #c96a15;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            border-color: #4c5fd4;
        }

        .action-btn.selected {
            background: #667eea;
            color: white;
        }

        .action-btn.danger {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .action-btn.danger:hover {
            border-color: #c0392b;
        }

        .action-btn.danger.selected {
            background: #e74c3c;
            color: white;
        }

        .finish-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .finish-screen h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
        }

        .stats-item {
            margin: 10px 0;
            color: #555;
        }

        .stats-label {
            font-weight: 600;
            color: #333;
        }

        .restart-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

            {"finnish": "Q", "english": "kuuh (cook)", "category": "Letter Sounds"},
            {"finnish": "R", "english": "aer (arrogant)", "category": "Letter Sounds"},
            {"finnish": "S", "english": "aes (ask)", "category": "Letter Sounds"},
            {"finnish": "T", "english": "teeh (tepid)", "category": "Letter Sounds"},
            {"finnish": "U", "english": "oo (foot)", "category": "Letter Sounds"},
            {"finnish": "V", "english": "veeh (very)", "category": "Letter Sounds"},
            {"finnish": "W", "english": "kahksoisveeh (very)", "category": "Letter Sounds"},
            {"finnish": "X", "english": "aex (axe)", "category": "Letter Sounds"},
            {"finnish": "Y", "english": "eew (cute)", "category": "Letter Sounds"},
            {"finnish": "Z", "english": "tset (like ts)", "category": "Letter Sounds"},
            {"finnish": "Ä", "english": "aeae (Adam, apple)", "category": "Letter Sounds"},
            {"finnish": "Ö", "english": "oeoe (Curl, girl, word)", "category": "Letter Sounds"},
        ];

        function FlashcardApp() {
            const [screen, setScreen] = useState('setup'); // 'setup', 'card', 'finish', 'wordbank', 'letterSounds'
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [startLanguage, setStartLanguage] = useState('finnish'); // 'finnish', 'english', 'challenge'
            const [deck, setDeck] = useState([]);
            const [totalCount, setTotalCount] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [kept, setKept] = useState(0);
            const [removed, setRemoved] = useState(0);
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            const [leavingCard, setLeavingCard] = useState(null); // { label, content, isEnglish, dir, phase }
            const [selectedAction, setSelectedAction] = useState(null); // null, 'remove', 'keep'
            const selectedTimeoutRef = useRef(null);
            const [expandedCategories, setExpandedCategories] = useState([]);
            const [isChallengeMode, setIsChallengeMode] = useState(false);
            const [progress, setProgress] = useState(() => {
                try {
                    const raw = localStorage.getItem('finnishFlashcardProgress');
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    return {};
                }
            });

            // "Letter Sounds" is a pronunciation reference chart, not a drillable
            // flashcard category, so it's kept out of the category list entirely.
            const categories = [...new Set(VOCAB_DATA.map(item => item.category))]
                .filter(category => category !== 'Letter Sounds')
                .sort();
            const letterSounds = VOCAB_DATA.filter(item => item.category === 'Letter Sounds');

            // Count words in each category
            const getCategoryCount = (category) => {
                return VOCAB_DATA.filter(item => item.category === category).length;
            };

            const getWordKey = (word) => `${word.category}|${word.finnish}`;

            const isWordMastered = (word) => {
                const entry = progress[getWordKey(word)];
                return !!(entry && entry.masteredStatus);
            };

            // Mastery only tracked for words displayed English-first. "Got It" builds a
            // streak toward mastery (2 in a row normally, 3 after ever missing one);
            // "Try Again" breaks the streak and un-masters the word immediately.
            const updateWordProgress = (word, action) => {
                if (!word || word.direction !== 'english') return;

                const key = getWordKey(word);
                setProgress(prev => {
                    const existing = prev[key] || {
                        displayedWithLanguage: 'english',
                        gotItCount: 0,
                        tryAgainCount: 0,
                        masteredStatus: false
                    };

                    let entry;
                    if (action === 'tryAgain') {
                        entry = {
                            ...existing,
                            tryAgainCount: existing.tryAgainCount + 1,
                            gotItCount: 0,
                            masteredStatus: false
                        };
                    } else if (action === 'master') {
                        // Manual override: the user is directly declaring this word
                        // mastered, bypassing the Got-It streak requirement.
                        entry = { ...existing, masteredStatus: true };
                    } else {
                        const gotItCount = existing.gotItCount + 1;
                        const threshold = existing.tryAgainCount === 0 ? 2 : 3;
                        entry = {
                            ...existing,
                            gotItCount,
                            masteredStatus: existing.masteredStatus || gotItCount >= threshold
                        };
                    }

                    const next = { ...prev, [key]: entry };
                    try {
                        localStorage.setItem('finnishFlashcardProgress', JSON.stringify(next));
                    } catch (e) {}
                    return next;
                });
            };

            const resetProgress = () => {
                if (!window.confirm('Are you sure? This will reset all your progress.')) return;
                setProgress({});
                try {
                    localStorage.removeItem('finnishFlashcardProgress');
                } catch (e) {}
            };

            const toggleCategory = (category) => {
                setSelectedCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            const toggleCategoryExpanded = (category) => {
                setExpandedCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            const startDrill = () => {
                if (selectedCategories.length === 0) {
                    alert('Please select at least one category');
                    return;
                }

                if (startLanguage === 'challenge') {
                    startChallengeMode();
                    return;
                }

                const filtered = VOCAB_DATA.filter(item =>
                    selectedCategories.includes(item.category)
                );

                const shuffled = [...filtered]
                    .sort(() => Math.random() - 0.5)
                    .map(item => ({ ...item, direction: startLanguage }));
                setDeck(shuffled);
                setTotalCount(shuffled.length);
                setIsFlipped(false);
                setKept(0);
                setRemoved(0);
                setLeavingCard(null);
                setSelectedAction(null);
                setIsChallengeMode(false);
                setScreen('card');
            };

            const startChallengeMode = () => {
                if (selectedCategories.length === 0) {
                    alert('Please select at least one category');
                    return;
                }

                const filtered = VOCAB_DATA.filter(item =>
                    selectedCategories.includes(item.category) && !isWordMastered(item)
                );

                if (filtered.length === 0) {
                    alert('All words mastered! Select another category or reset.');
                    return;
                }

                // Challenge Mode always drills English-first, since mastery is only
                // ever tracked for English-first cards.
                const shuffled = [...filtered]
                    .sort(() => Math.random() - 0.5)
                    .map(item => ({ ...item, direction: 'english' }));
                setDeck(shuffled);
                setTotalCount(shuffled.length);
                setIsFlipped(false);
                setKept(0);
                setRemoved(0);
                setLeavingCard(null);
                setSelectedAction(null);
                setIsChallengeMode(true);
                setScreen('card');
            };

            const selectAction = (action) => {
                setSelectedAction(action);
                clearTimeout(selectedTimeoutRef.current);
                selectedTimeoutRef.current = setTimeout(() => setSelectedAction(null), 500);
            };

            const startLeaving = (anim) => {
                const { frontLabel, front, backLabel, back } = getCardDisplay();
                const label = isFlipped ? backLabel : frontLabel;
                const content = isFlipped ? back : front;
                setLeavingCard({ label, content, isEnglish: label === 'ENGLISH', anim, phase: 'in' });
            };

            const handleKeep = () => {
                if (leavingCard) return;
                const card = getCurrentCard();
                selectAction('keep');
                startLeaving('sink');
                updateWordProgress(card, 'tryAgain');
                setKept(prev => prev + 1);
                setDeck(prev => {
                    const [first, ...rest] = prev;
                    return [...rest, first];
                });
                setIsFlipped(false);
            };

            const handleRemove = () => {
                if (leavingCard) return;
                const card = getCurrentCard();
                selectAction('remove');
                startLeaving('left');
                updateWordProgress(card, 'gotIt');
                setRemoved(prev => prev + 1);
                setDeck(prev => prev.slice(1));
                setIsFlipped(false);
            };

            const handleMasterCard = () => {
                if (leavingCard) return;
                const card = getCurrentCard();
                selectAction('remove');
                startLeaving('left');
                updateWordProgress(card, 'master');
                setRemoved(prev => prev + 1);
                setDeck(prev => prev.slice(1));
                setIsFlipped(false);
            };

            const skipCard = () => {
                if (leavingCard) return;
                setDeck(prev => {
                    const [first, ...rest] = prev;
                    return [...rest, first];
                });
                setIsFlipped(false);
            };

            const restartDrill = () => {
                setScreen('setup');
                setSelectedCategories([]);
                setStartLanguage('finnish');
                setIsChallengeMode(false);
            };

            useEffect(() => {
                if (screen === 'card' && deck.length === 0 && totalCount > 0) {
                    setScreen('finish');
                }
            }, [screen, deck, totalCount]);

            useEffect(() => {
                if (!leavingCard) return;
                if (leavingCard.phase === 'in') {
                    const frame = requestAnimationFrame(() => {
                        setLeavingCard(prev => prev && { ...prev, phase: 'out' });
                    });
                    return () => cancelAnimationFrame(frame);
                }
                const timeout = setTimeout(() => setLeavingCard(null), 300);
                return () => clearTimeout(timeout);
            }, [leavingCard]);

            const getCurrentCard = () => {
                if (deck.length === 0) return null;
                return deck[0];
            };

            const getCardDisplay = () => {
                const card = getCurrentCard();
                if (!card) return { front: '', frontLabel: '', back: '', backLabel: '' };

                let front, frontLabel, back, backLabel;

                if (card.direction === 'finnish') {
                    front = card.finnish;
                    frontLabel = 'FINNISH';
                    back = card.english;
                    backLabel = 'ENGLISH';
                } else {
                    front = card.english;
                    frontLabel = 'ENGLISH';
                    back = card.finnish;
                    backLabel = 'FINNISH';
                }

                return { front, frontLabel, back, backLabel };
            };

            // Swipe detection
            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX + ',' + e.targetTouches[0].clientY);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX + ',' + e.targetTouches[0].clientY);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;

                const [startX, startY] = touchStart.split(',').map(Number);
                const [endX, endY] = touchEnd.split(',').map(Number);

                const distanceX = startX - endX;
                const distanceY = startY - endY;
                const isLeftSwipe = distanceX > minSwipeDistance;
                const isRightSwipe = distanceX < -minSwipeDistance;

                if (Math.abs(distanceX) > Math.abs(distanceY)) {
                    // Horizontal swipe (left/right motion) - flip card
                    if (isRightSwipe || isLeftSwipe) {
                        setIsFlipped(!isFlipped);
                    }
                }
            };

            if (screen === 'setup') {
                return (
                    <div className="container screen">
                        <div className="setup-section">
                            <h2>📚 Select Categories</h2>
                            <div className="category-grid">
                                {categories.map(category => (
                                    <button
                                        key={category}
                                        className={`category-btn ${selectedCategories.includes(category) ? 'active' : ''}`}
                                        onClick={() => toggleCategory(category)}
                                        title={`${getCategoryCount(category)} words`}
                                    >
                                        <div className="category-btn-name">{category}</div>
                                        <div className="category-btn-count">{getCategoryCount(category)}</div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="setup-section">
                            <h2>🎯 Flashcard Mode</h2>
                            <div className="option-group">
                                <button
                                    className={`option-btn ${startLanguage === 'english' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('english')}
                                >
                                    <div className="option-btn-icon">🇬🇧</div>
                                    <div>English</div>
                                    <div className="option-btn-desc">Shows English word first</div>
                                </button>
                                <button
                                    className={`option-btn ${startLanguage === 'finnish' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('finnish')}
                                >
                                    <div className="option-btn-icon">🇫🇮</div>
                                    <div>Finnish</div>
                                    <div className="option-btn-desc">Shows Finnish word first</div>
                                </button>
                                <button
                                    className={`option-btn challenge ${startLanguage === 'challenge' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('challenge')}
                                >
                                    <div className="option-btn-icon">🔥</div>
                                    <div>Challenge Mode</div>
                                    <div className="option-btn-desc">Shows only words you haven't mastered</div>
                                </button>
                            </div>
                        </div>

                        <div className="setup-divider"></div>

                        <div className="setup-actions">
                            <button className="wordbank-btn" onClick={() => setScreen('wordbank')}>
                                📖 Word Bank
                            </button>
                            <button className="wordbank-btn" onClick={() => setScreen('letterSounds')}>
                                🔤 Letter Sounds
                            </button>
                            <button className="start-btn" onClick={startDrill}>
                                Let's go! →
                            </button>
                        </div>

                        <button className="reset-progress-link" onClick={resetProgress}>
                            🗑️ Reset Progress
                        </button>
                    </div>
                );
            }

            if (screen === 'wordbank') {
                return (
                    <div className="container screen wordbank-screen">
                        <div className="wordbank-header">
                            <button className="nav-btn" onClick={() => setScreen('setup')}>← Back</button>
                            <h2 className="wordbank-title">📖 Word Bank</h2>
                        </div>

                        <div className="wordbank-list">
                            {categories.map(category => {
                                const words = VOCAB_DATA.filter(item => item.category === category);
                                const isExpanded = expandedCategories.includes(category);
                                return (
                                    <div className="wordbank-category" key={category}>
                                        <button
                                            className="wordbank-category-header"
                                            onClick={() => toggleCategoryExpanded(category)}
                                        >
                                            <span>{category} ({words.length})</span>
                                            <span className="wordbank-chevron">{isExpanded ? '▲' : '▼'}</span>
                                        </button>
                                        {isExpanded && (
                                            <div className="wordbank-words">
                                                {words.map((word, i) => (
                                                    <div className="wordbank-word-row" key={i}>
                                                        <span className="wordbank-fi">{word.finnish}</span>
                                                        <span className="wordbank-sep">—</span>
                                                        <span className="wordbank-en">{word.english}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            if (screen === 'letterSounds') {
                return (
                    <div className="container screen wordbank-screen">
                        <div className="wordbank-header">
                            <button className="nav-btn" onClick={() => setScreen('setup')}>← Back</button>
                            <h2 className="wordbank-title">🔤 Letter Sounds</h2>
                        </div>

                        <div className="letter-grid">
                            {letterSounds.map(item => {
                                const match = item.english.match(/^(.*?)\s*\((.*)\)\s*$/);
                                const sound = match ? match[1] : item.english;
                                const example = match ? match[2] : '';
                                return (
                                    <div className="letter-card" key={item.finnish}>
                                        <div className="letter-char">{item.finnish}</div>
                                        <div className="letter-sound">{sound}</div>
                                        {example && <div className="letter-example">{example}</div>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            if (screen === 'card') {
                const card = getCurrentCard();
                if (!card) return null;

                const { front, frontLabel, back, backLabel } = getCardDisplay();
                const displayedLabel = isFlipped ? backLabel : frontLabel;
                const displayedContent = isFlipped ? back : front;
                const isEnglish = displayedLabel === 'ENGLISH';

                return (
                    <div 
                        className="container screen"
                        onTouchStart={onTouchStart}
                        onTouchMove={onTouchMove}
                        onTouchEnd={onTouchEnd}
                    >
                        <div className="card-header">
                            <div className="nav-buttons">
                                <button className="nav-btn" onClick={() => setScreen('setup')}>home</button>
                                <button className="nav-btn" onClick={skipCard}>skip</button>
                            </div>
                            <div className="progress-info">
                                {isChallengeMode && '🔥 '}{deck.length} card{deck.length === 1 ? '' : 's'} left
                            </div>
                        </div>

                        <div className="card-stack">
                            {deck.length > 2 && <div className="card card-ghost card-ghost-2"></div>}
                            {deck.length > 1 && <div className="card card-ghost card-ghost-1"></div>}
                            <div
                                className={`card ${isEnglish ? 'english' : ''}`}
                                onClick={() => setIsFlipped(!isFlipped)}
                            >
                                <div className="card-label">{displayedLabel}</div>
                                <div className="card-content">{displayedContent}</div>
                            </div>
                            {leavingCard && (
                                <div
                                    className={`card card-leaving ${leavingCard.isEnglish ? 'english' : ''} ${leavingCard.phase === 'out' ? (leavingCard.anim === 'left' ? 'slide-left' : 'sink-back') : ''}`}
                                >
                                    <div className="card-label">{leavingCard.label}</div>
                                    <div className="card-content">{leavingCard.content}</div>
                                </div>
                            )}
                        </div>

                        <div className="action-buttons">
                            <button className={`action-btn danger ${selectedAction === 'keep' ? 'selected' : ''}`} onClick={handleKeep}>
                                ✗ Try again
                            </button>
                            <button className={`action-btn ${selectedAction === 'remove' ? 'selected' : ''}`} onClick={handleRemove}>
                                ✓ Got it!
                            </button>
                        </div>

                        {card.direction === 'english' && (
                            <button className="challenge-link" onClick={handleMasterCard}>
                                ⭐ Mastered! Remove from challenge mode
                            </button>
                        )}
                    </div>
                );
            }

            if (screen === 'finish') {
                const totalAttempts = kept + removed;
                const percentage = totalAttempts > 0 ? Math.round((removed / totalAttempts) * 100) : 0;

                return (
                    <div className="container screen">
                        <div className="finish-screen">
                            <h2>🎉 Onnittelut! 🎉</h2>
                            <div className="stats">
                                <div className="stats-item">
                                    <span className="stats-label">Total cards:</span> {totalCount}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">✓ Correct:</span> {removed}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">✗ Missed:</span> {kept}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">Accuracy:</span> {percentage}%
                                </div>
                            </div>
                            <button className="restart-btn" onClick={restartDrill}>
                                ← Back to Setup
                            </button>
                            {!isChallengeMode && (
                                <button className="challenge-link" onClick={startChallengeMode}>
                                    🔥 Try Challenge Mode?
                                </button>
                            )}
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.render(<FlashcardApp />, document.getElementById('root'));
    </script>
</body>
</html>
