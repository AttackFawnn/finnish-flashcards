<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnish Flashcards</title>

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100dvh;
            padding: 10px;
        }

        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .container {
            width: 100%;
            max-width: 600px;
            max-height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .screen {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Setup Screen */
        .setup-section {
            margin-bottom: 25px;
        }

        .setup-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .category-btn-name {
            font-size: 13px;
            font-weight: 700;
        }

        .category-btn-count {
            font-size: 11px;
            color: #666;
            font-weight: 400;
        }

        .category-btn:hover {
            border-color: #667eea;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .category-btn.active .category-btn-count {
            color: rgba(255,255,255,0.8);
        }

        .option-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            min-width: 100px;
        }

        .option-btn:hover {
            border-color: #667eea;
        }

        .option-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Card Screen */
        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            position: relative;
        }

        .progress-info {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-buttons {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            pointer-events: auto;
            padding: 5px 10px;
        }

        .nav-btn:hover {
            color: #667eea;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            margin: 30px 0;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .card.flipped {
            background: linear-gradient(135deg, #4a5aa8 0%, #523370 100%);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-content {
            font-size: 32px;
            font-weight: bold;
            word-wrap: break-word;
        }

        @media (max-width: 480px) {
            .card-content {
                font-size: 24px;
            }
            .card {
                min-height: 200px;
                padding: 30px 15px;
            }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
        }

        .action-btn.remove {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .action-btn.remove:hover {
            background: #e74c3c;
            color: white;
        }

        .finish-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .finish-screen h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
        }

        .stats-item {
            margin: 10px 0;
            color: #555;
        }

        .stats-label {
            font-weight: 600;
            color: #333;
        }

        .restart-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

            const [touchEnd, setTouchEnd] = useState(null);

            const categories = [...new Set(VOCAB_DATA.map(item => item.category))].sort();
            
            // Count words in each category
            const getCategoryCount = (category) => {
                return VOCAB_DATA.filter(item => item.category === category).length;
            };

            const toggleCategory = (category) => {
                setSelectedCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            const startDrill = () => {
                if (selectedCategories.length === 0) {
                    alert('Please select at least one category');
                    return;
                }

                const filtered = VOCAB_DATA.filter(item =>
                    selectedCategories.includes(item.category)
                );

                // Shuffle the deck
                const shuffled = [...filtered].sort(() => Math.random() - 0.5);
                setDeck(shuffled);
                setCurrentIndex(0);
                setIsFlipped(false);
                setKept(0);
                setRemoved(0);
                setScreen('card');
            };

            const handleKeep = () => {
                setKept(kept + 1);
                nextCard();
            };

            const handleRemove = () => {
                setRemoved(removed + 1);
                nextCard();
            };

            const nextCard = () => {
                if (currentIndex + 1 >= deck.length) {
                    setScreen('finish');
                } else {
                    setCurrentIndex(currentIndex + 1);
                    setIsFlipped(false);
                }
            };

            const skipCard = () => {
                nextCard();
            };

            const restartDrill = () => {
                setScreen('setup');
                setSelectedCategories([]);
                setStartLanguage('finnish');
            };

            const getCurrentCard = () => {
                if (deck.length === 0) return null;
                return deck[currentIndex];
            };

            const getCardDisplay = () => {
                const card = getCurrentCard();
                if (!card) return { front: '', frontLabel: '', back: '', backLabel: '' };

                let front, frontLabel, back, backLabel;

                if (startLanguage === 'random') {
                    const isFinFirstTime = Math.random() > 0.5;
                    if (isFinFirstTime) {
                        front = card.finnish;
                        frontLabel = 'FINNISH';
                        back = card.english;
                        backLabel = 'ENGLISH';
                    } else {
                        front = card.english;
                        frontLabel = 'ENGLISH';
                        back = card.finnish;
                        backLabel = 'FINNISH';
                    }
                } else if (startLanguage === 'finnish') {
                    front = card.finnish;
                    frontLabel = 'FINNISH';
                    back = card.english;
                    backLabel = 'ENGLISH';
                } else {
                    front = card.english;
                    frontLabel = 'ENGLISH';
                    back = card.finnish;
                    backLabel = 'FINNISH';
                }

                return { front, frontLabel, back, backLabel };
            };

            // Swipe detection
            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX + ',' + e.targetTouches[0].clientY);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX + ',' + e.targetTouches[0].clientY);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;

                const [startX, startY] = touchStart.split(',').map(Number);
                const [endX, endY] = touchEnd.split(',').map(Number);

                const distanceX = startX - endX;
                const distanceY = startY - endY;
                const isLeftSwipe = distanceX > minSwipeDistance;
                const isRightSwipe = distanceX < -minSwipeDistance;

                if (Math.abs(distanceX) > Math.abs(distanceY)) {
                    // Horizontal swipe (left/right motion) - flip card
                    if (isRightSwipe || isLeftSwipe) {
                        setIsFlipped(!isFlipped);
                    }
                }
            };

            if (screen === 'setup') {
                return (
                    <div className="container screen">
                        <div className="setup-section">
                            <h2>📚 Select Categories</h2>
                            <div className="category-grid">
                                {categories.map(category => (
                                    <button
                                        key={category}
                                        className={`category-btn ${selectedCategories.includes(category) ? 'active' : ''}`}
                                        onClick={() => toggleCategory(category)}
                                        title={`${getCategoryCount(category)} words`}
                                    >
                                        <div className="category-btn-name">{category}</div>
                                        <div className="category-btn-count">{getCategoryCount(category)}</div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="setup-section">
                            <h2>🎯 Start With</h2>
                            <div className="option-group">
                                <button
                                    className={`option-btn ${startLanguage === 'finnish' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('finnish')}
                                >
                                    🇫🇮 Finnish
                                </button>
                                <button
                                    className={`option-btn ${startLanguage === 'english' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('english')}
                                >
                                    🇬🇧 English
                                </button>
                                <button
                                    className={`option-btn ${startLanguage === 'random' ? 'active' : ''}`}
                                    onClick={() => setStartLanguage('random')}
                                >
                                    🎲 Random
                                </button>
                            </div>
                        </div>

                        <button className="start-btn" onClick={startDrill}>
                            Let's go! →
                        </button>
                    </div>
                );
            }

            if (screen === 'card') {
                const card = getCurrentCard();
                if (!card) return null;

                const { front, frontLabel, back, backLabel } = getCardDisplay();

                return (
                    <div 
                        className="container screen"
                        onTouchStart={onTouchStart}
                        onTouchMove={onTouchMove}
                        onTouchEnd={onTouchEnd}
                    >
                        <div className="card-header">
                            <div className="nav-buttons">
                                <button className="nav-btn" onClick={() => setScreen('setup')}>home</button>
                                <button className="nav-btn" onClick={skipCard}>skip</button>
                            </div>
                            <div className="progress-info">
                                Card {currentIndex + 1} of {deck.length}
                            </div>
                        </div>

                        <div 
                            className={`card ${isFlipped ? 'flipped' : ''}`} 
                            onClick={() => setIsFlipped(!isFlipped)}
                            style={{cursor: 'pointer'}}
                        >
                            <div className="card-label">{isFlipped ? backLabel : frontLabel}</div>
                            <div className="card-content">{isFlipped ? back : front}</div>
                            <div style={{fontSize: '12px', opacity: 0.7, marginTop: '15px'}}>
                                tap or swipe to flip
                            </div>
                        </div>

                        <div className="action-buttons">
                            <button className="action-btn remove" onClick={handleRemove}>
                                ✗ Remove
                            </button>
                            <button className="action-btn" onClick={handleKeep}>
                                ✓ Keep
                            </button>
                        </div>
                    </div>
                );
            }

            if (screen === 'finish') {
                const total = kept + removed;
                const percentage = total > 0 ? Math.round((kept / total) * 100) : 0;

                return (
                    <div className="container screen">
                        <div className="finish-screen">
                            <h2>✨ Drill Complete!</h2>
                            <div className="stats">
                                <div className="stats-item">
                                    <span className="stats-label">Cards Reviewed:</span> {total}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">✓ Kept:</span> {kept}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">✗ Removed:</span> {removed}
                                </div>
                                <div className="stats-item">
                                    <span className="stats-label">Accuracy:</span> {percentage}%
                                </div>
                            </div>
                            <button className="restart-btn" onClick={restartDrill}>
                                ← Back to Setup
                            </button>
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.render(<FlashcardApp />, document.getElementById('root'));
    </script>
</body>
</html>
